[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-bandits-dashboard"
version = "0.1.0"
description = "Interactive companion dashboard for the trust-bandits paper"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
    "plotly>=5.20",
    "pandas>=2.0",
    "numpy>=1.24",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["dashboard*"]
